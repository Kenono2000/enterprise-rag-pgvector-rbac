services:
  - type: web
    name: enterprise-rag-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false # You will paste your Neon URL in the Render dashboard
      - key: OPENAI_API_KEY
        sync: false # Optional: Paste your key, or leave blank to use the mock fallback
  - type: web
    name: enterprise-rag-gateway
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements-gateway.txt
    startCommand: python -m app.mcp --transport http --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: REQUIRE_GOOGLE_AUTH
        value: "false"
      - key: RETRIEVAL_BACKEND
        value: pgvector
      - key: MCP_HOST
        value: 0.0.0.0

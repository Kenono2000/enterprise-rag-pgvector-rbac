services:
  - type: web
    name: enterprise-rag-mcp
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python mcp_server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false # You will paste this in the Render dashboard
      - key: PORT
        value: 8000